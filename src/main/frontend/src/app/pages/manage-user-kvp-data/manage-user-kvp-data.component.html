<section class="page">
  <div class="page-header">
    <div>
      <h1>{{ 'manageKvp.title' | t }}</h1>
      <p class="subtle">{{ 'manageKvp.subtitle' | t }}</p>
    </div>
    <button class="button secondary" type="button" (click)="startNew()">{{ 'manageKvp.new' | t }}</button>
  </div>

  <app-alerts [alerts]="alerts"></app-alerts>

  <div class="split">
    <div class="list-panel">
      <table class="table" *ngIf="kvpData.length > 0">
        <thead>
          <tr>
            <th>{{ 'manageKvp.table.key' | t }}</th>
            <th>{{ 'manageKvp.table.value' | t }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of kvpData" (click)="selectKvp(item)" [class.active]="selectedKvp?.extId === item.extId">
            <td>{{ item.key }}</td>
            <td>{{ item.value }}</td>
          </tr>
        </tbody>
      </table>
      <div class="empty-state" *ngIf="kvpData.length === 0">{{ 'manageKvp.empty' | t }}</div>
    </div>

    <div class="form-panel">
      <h2>{{ selectedKvp ? ('manageKvp.form.editTitle' | t) : ('manageKvp.form.newTitle' | t) }}</h2>

      <div class="inline-actions entry-mode" *ngIf="!selectedKvp">
        <button class="button secondary" type="button" (click)="entryMode = 'single'" [class.active]="entryMode === 'single'">
          {{ 'manageKvp.form.single' | t }}
        </button>
        <button class="button secondary" type="button" (click)="entryMode = 'bulk'" [class.active]="entryMode === 'bulk'">
          {{ 'manageKvp.form.bulk' | t }}
        </button>
      </div>

      <form [formGroup]="form" class="form-grid">
        <label class="field" *ngIf="entryMode === 'single'">
          {{ 'manageKvp.table.key' | t }}
          <input type="text" formControlName="key" />
        </label>
        <label class="field" *ngIf="entryMode === 'single'">
          {{ 'manageKvp.table.value' | t }}
          <textarea rows="6" formControlName="value"></textarea>
        </label>
        <label class="field" *ngIf="entryMode === 'bulk' && !selectedKvp">
          {{ 'manageKvp.form.bulk' | t }}
          <textarea rows="6" formControlName="bulkValue" [placeholder]="'manageKvp.form.bulkPlaceholder' | t"></textarea>
        </label>
      </form>

      <div class="inline-actions">
        <button class="button" type="button" (click)="save()" [disabled]="isBusy">{{ 'common.save' | t }}</button>
        <button class="button danger" type="button" (click)="delete()" [disabled]="!selectedKvp || isBusy">
          {{ 'common.delete' | t }}
        </button>
      </div>
    </div>
  </div>
</section>
